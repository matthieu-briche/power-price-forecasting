name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest --cov=powerfc --cov-report=term-missing

  integration:
    # Full pipeline against a real MongoDB service container.
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Ingest + back-test through MongoDB
        env:
          MONGO_URI: mongodb://localhost:27017
          DAYS: "400"
          TEST_DAYS: "14"
        run: bash scripts/run_pipeline.sh
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t powerfc:${{ github.sha }} .
      - name: Smoke test
        run: docker run --rm powerfc:${{ github.sha }} backtest --source synthetic --days 200 --test-days 7 --models naive ridge
